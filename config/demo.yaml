robot_urdf: third_party/trlc-dk1/urdf/follower/TRLC-DK1-Follower.urdf
object_center: [0.48, 0.0, 0.10]
object_size: [0.20, 0.20, 0.20]
view_angles_deg: [115, 150, 210, 245]
view_radii: [0.23, 0.28, 0.28, 0.23]
view_heights: [0.28, 0.34, 0.34, 0.28]
dwell_seconds: 1.0
target_duration_seconds: 18.0
camera_frame: camera
sample_dt: 0.02
# Caps support the wide sweep; the 18 s loop includes four 1 s captures.
velocity_scale: 0.5
acceleration_scale: 1.0
# The upstream URDF provides NO joint acceleration ratings. This is an
# explicit simulation reference, NOT a manufacturer or measured maximum.
acceleration_reference_rad_s2: [6.5, 6.5, 6.5, 6.5, 6.5, 6.5]
acceleration_reference_source: assumed_demo_reference_not_hardware_rating
view_rolls_deg: [-15, 0, 0, 15]
# Keep the image-down axis in the downward half-plane throughout playback.
max_camera_roll_deg: 20.0
camera_guide_step_deg: 1.0
max_continuous_aim_error_deg: 0.5
upward_arc:
  radius: 0.38
  azimuth_deg: 180.0
  start_elevation_deg: 25.0
  auto_max_elevation: true
  max_elevation_search_deg: 89.0
  endpoint_margin_deg: 0.5
  limit_search_step_deg: 2.0
  limit_search_tolerance_deg: 0.01
  guide_step_deg: 0.25
  num_views: 4
  max_camera_roll_deg: 5.0
